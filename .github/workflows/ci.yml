name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Unit, property, contract and integration tests
        run: uv run pytest -q
      - name: Compose configuration
        run: |
          printf 'ci-placeholder\n' > /tmp/tradingagent-history-key
          printf 'ci-placeholder\n' > /tmp/tradingagent-postgres-password
          OCTOBOT_HISTORY_API_KEY_FILE=/tmp/tradingagent-history-key \
          POSTGRES_PASSWORD_FILE=/tmp/tradingagent-postgres-password \
          docker compose config --quiet
      - name: Python dependency audit
        run: uvx pip-audit

  container-security:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tradingagent:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: tradingagent:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate SPDX SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: tradingagent:ci
          format: spdx-json
          output-file: tradingagent.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: tradingagent-sbom
          path: tradingagent.spdx.json
