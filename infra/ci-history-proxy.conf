events {}

pid /tmp/nginx.pid;

http {
  access_log off;

  server {
    listen 8080;

    location = /api/v1/historical/datasets {
      limit_except GET { deny all; }
      proxy_pass http://history-stub:5002;
      proxy_pass_request_headers off;
      proxy_set_header X-API-Key $http_x_api_key;
    }

    location = /api/v1/historical/candles {
      limit_except GET { deny all; }
      proxy_pass http://history-stub:5002;
      proxy_pass_request_headers off;
      proxy_set_header X-API-Key $http_x_api_key;
    }

    location / {
      return 404;
    }
  }
}
