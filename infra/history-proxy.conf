events {}

http {
  access_log off;
  server_tokens off;

  server {
    listen 8080;
    client_max_body_size 1k;

    location = /api/v1/historical/datasets {
      limit_except GET { deny all; }
      proxy_pass http://192.168.178.20:5002;
      proxy_pass_request_headers off;
      proxy_set_header X-API-Key $http_x_api_key;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      proxy_buffering on;
      proxy_max_temp_file_size 0;
    }

    location = /api/v1/historical/candles {
      limit_except GET { deny all; }
      proxy_pass http://192.168.178.20:5002;
      proxy_pass_request_headers off;
      proxy_set_header X-API-Key $http_x_api_key;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      proxy_buffering on;
      proxy_max_temp_file_size 0;
    }

    location / {
      return 404;
    }
  }
}
