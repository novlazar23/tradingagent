[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingagent"
version = "0.1.0"
description = "BTC/USDT backtesting and paper-trading service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[project.scripts]
tradingagent = "tradingagent.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.108,<7",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "time-machine>=2.15,<3",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradingagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tradingagent"]
